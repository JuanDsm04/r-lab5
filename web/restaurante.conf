# /etc/apache2/sites-available/restaurante.conf
# Virtual host de www.restaurante.redes.test con login contra OpenLDAP.

# Sin cache compartida de LDAP: cada acceso consulta a slapd.
# Asi WEB-05 (slapd detenido) falla siempre y no se atiende desde cache.
LDAPSharedCacheSize 0

<VirtualHost *:80>
    ServerName www.restaurante.redes.test
    DocumentRoot /var/www/restaurante

    <Directory /var/www/restaurante>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Seccion protegida: cualquier usuario de ou=People puede entrar.
    # Apache busca uid=<usuario> (busqueda anonima) y valida la contrasena
    # haciendo bind con el DN encontrado. No requiere bind DN de servicio.
    <Directory /var/www/restaurante/privado>
        # SSI para mostrar el usuario autenticado (REMOTE_USER) en la pagina
        Options +Includes
        AddOutputFilter INCLUDES .html

        AuthType Basic
        AuthName "Area protegida - Restaurante (usuario LDAP)"
        AuthBasicProvider ldap
        AuthLDAPURL "ldap://ldap.restaurante.redes.test/ou=People,dc=restaurante,dc=redes,dc=test?uid?sub"
        Require valid-user
    </Directory>

    # Registra en el error.log los fallos de autenticacion y de conexion a LDAP
    LogLevel warn authnz_ldap:info ldap:info
    ErrorLog ${APACHE_LOG_DIR}/restaurante_error.log
    CustomLog ${APACHE_LOG_DIR}/restaurante_access.log combined
</VirtualHost>
