# Lab 5 - Dovecot: IMAP para clientes, LMTP para entrega desde Postfix
protocols = imap lmtp
listen = *

# Logs a syslog -> /var/log/mail.log (junto con Postfix)
auth_verbose = yes
auth_verbose_passwords = no
verbose_ssl = no

# Usuarios pueden escribir "juan" o "juan@restaurante.redes.test"
auth_username_format = %Ln
auth_mechanisms = plain login
# Laboratorio: permite login sin TLS
disable_plaintext_auth = no

ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key  = </etc/ssl/private/ssl-cert-snakeoil.key

# Contraseñas: OpenLDAP
passdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}
# Buzones: todos pertenecen al usuario de sistema vmail
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/vmail/%n allow_all_users=yes
}

mail_location = maildir:~/Maildir
first_valid_uid = 5000

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
  }
}

# Socket donde Postfix entrega el correo
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# Socket donde Postfix pregunta usuario/contraseña (SMTP AUTH)
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

protocol lmtp {
  postmaster_address = postmaster@restaurante.redes.test
}
