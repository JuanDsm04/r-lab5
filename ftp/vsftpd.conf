# Configuración de vsftpd para ftp.restaurante.redes.test.
# Se instala con: sudo bash ftp/setup.sh
# No contiene direcciones IP, por lo que no requiere cambios si cambia la red.

# Ejecución como servicio independiente en IPv4.
listen=YES
listen_ipv6=NO
listen_port=21

# Acceso: sin usuarios anónimos, solo usuarios locales autenticados por PAM.
anonymous_enable=NO
local_enable=YES
pam_service_name=vsftpd
write_enable=YES
local_umask=022

# Lista de usuarios permitidos. Cualquier otro usuario es rechazado.
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Restricción de cada usuario a /srv/ftp/<usuario>.
chroot_local_user=YES
user_sub_token=$USER
local_root=/srv/ftp/$USER
secure_chroot_dir=/var/run/vsftpd/empty
ls_recurse_enable=NO
hide_ids=YES

# Modo pasivo con rango de puertos limitado.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# Modo activo: el servidor inicia la conexión de datos desde el puerto 20.
port_enable=YES
connect_from_port_20=YES

# Registro de conexiones, autenticaciones, transferencias y comandos FTP.
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES
dual_log_enable=YES
xferlog_file=/var/log/xferlog
use_localtime=YES

# Otros parámetros.
ftpd_banner=Servidor FTP de restaurante.redes.test - Laboratorio 5 CC3067
dirmessage_enable=YES
utf8_filesystem=YES
ssl_enable=NO
